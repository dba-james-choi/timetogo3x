name: Update Weather Data

on:
  schedule:
    # Twice a day, 12 hours apart (UTC). Roughly early morning and
    # early evening in Victoria, BC (Pacific time) year-round.
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest weather data
        run: python3 scripts/fetch_weather.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/weather.json; then
            echo "No weather changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git commit -m "chore: update weather data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
