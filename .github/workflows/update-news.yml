name: Update News Data

on:
  schedule:
    # 06:00 Victoria (Pacific) time is 13:00 UTC (PDT) or 14:00 UTC (PST)
    # depending on the season -- same DST-safe double-schedule approach as
    # update-data.yml, since the user asked for specifically 6am, not just
    # "roughly morning".
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest news
        run: python3 scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: update news data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
