<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QQQM / SOXX / SPYM / BTC-USD 일봉 차트</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>QQQM · SOXX · SPYM · BTC-USD 일봉 차트</h1>
    <p class="subtitle">최근 1개월 · 매일 자동 갱신 (GitHub Actions)</p>
  </header>

  <main id="charts">
    <section class="chart-card" data-ticker="QQQM">
      <div class="chart-card-header">
        <div class="ticker-title">
          <h2>QQQM</h2>
          <span class="last-price" data-role="last-price">-</span>
        </div>
        <div class="badges">
          <span class="badge" data-role="period-badge">-</span>
          <span class="badge badge-muted" data-role="peak-badge">-</span>
          <span class="badge badge-lowest" data-role="lowest-badge" hidden>-</span>
        </div>
      </div>
      <div class="range-tabs">
        <span class="range-tab" data-disabled>1D</span>
        <span class="range-tab" data-disabled>5D</span>
        <span class="range-tab range-tab-active">1M</span>
        <span class="range-tab" data-disabled>6M</span>
        <span class="range-tab" data-disabled>YTD</span>
        <span class="range-tab" data-disabled>1Y</span>
      </div>
      <div class="chart-container" data-role="chart"></div>
      <div class="updated-at" data-role="updated-at">-</div>
    </section>

    <section class="chart-card" data-ticker="SOXX">
      <div class="chart-card-header">
        <div class="ticker-title">
          <h2>SOXX</h2>
          <span class="last-price" data-role="last-price">-</span>
        </div>
        <div class="badges">
          <span class="badge" data-role="period-badge">-</span>
          <span class="badge badge-muted" data-role="peak-badge">-</span>
          <span class="badge badge-lowest" data-role="lowest-badge" hidden>-</span>
        </div>
      </div>
      <div class="range-tabs">
        <span class="range-tab" data-disabled>1D</span>
        <span class="range-tab" data-disabled>5D</span>
        <span class="range-tab range-tab-active">1M</span>
        <span class="range-tab" data-disabled>6M</span>
        <span class="range-tab" data-disabled>YTD</span>
        <span class="range-tab" data-disabled>1Y</span>
      </div>
      <div class="chart-container" data-role="chart"></div>
      <div class="updated-at" data-role="updated-at">-</div>
    </section>

    <section class="chart-card" data-ticker="SPYM">
      <div class="chart-card-header">
        <div class="ticker-title">
          <h2>SPYM</h2>
          <span class="last-price" data-role="last-price">-</span>
        </div>
        <div class="badges">
          <span class="badge" data-role="period-badge">-</span>
          <span class="badge badge-muted" data-role="peak-badge">-</span>
          <span class="badge badge-lowest" data-role="lowest-badge" hidden>-</span>
        </div>
      </div>
      <div class="range-tabs">
        <span class="range-tab" data-disabled>1D</span>
        <span class="range-tab" data-disabled>5D</span>
        <span class="range-tab range-tab-active">1M</span>
        <span class="range-tab" data-disabled>6M</span>
        <span class="range-tab" data-disabled>YTD</span>
        <span class="range-tab" data-disabled>1Y</span>
      </div>
      <div class="chart-container" data-role="chart"></div>
      <div class="updated-at" data-role="updated-at">-</div>
    </section>

    <section class="chart-card" data-ticker="BTC-USD">
      <div class="chart-card-header">
        <div class="ticker-title">
          <h2>BTC/USD</h2>
          <span class="last-price" data-role="last-price">-</span>
        </div>
        <div class="badges">
          <span class="badge" data-role="period-badge">-</span>
          <span class="badge badge-muted" data-role="peak-badge">-</span>
          <span class="badge badge-lowest" data-role="lowest-badge" hidden>-</span>
        </div>
      </div>
      <div class="range-tabs">
        <span class="range-tab" data-disabled>1D</span>
        <span class="range-tab" data-disabled>5D</span>
        <span class="range-tab range-tab-active">1M</span>
        <span class="range-tab" data-disabled>6M</span>
        <span class="range-tab" data-disabled>YTD</span>
        <span class="range-tab" data-disabled>1Y</span>
      </div>
      <div class="chart-container" data-role="chart"></div>
      <div class="updated-at" data-role="updated-at">-</div>
    </section>
  </main>

  <footer>
    <p>데이터: Yahoo Finance · 자동 갱신: GitHub Actions (평일 1일 1회)</p>
  </footer>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
